version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gypsi
      POSTGRES_PASSWORD: gypsi
      POSTGRES_DB: gypsi
    ports:
      - "5432:5432"
    volumes:
      - gypsi_pgdata:/var/lib/postgresql/data

  mcp:
    build: ./mcp
    env_file: .env
    ports:
      - "8080:8080"

  api:
    build: ./backend
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  worker:
    build: ./worker
    env_file: .env
    depends_on:
      - postgres
      - mcp

volumes:
  gypsi_pgdata:
