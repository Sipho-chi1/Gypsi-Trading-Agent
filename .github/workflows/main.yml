name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # manual trigger for debugging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_WORKER: ${{ github.repository }}-worker
  # IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend  # commented out for now

  # Global flag to enable/disable frontend jobs
  ENABLE_FRONTEND: false

jobs:
  # ======================================================================
  # STAGE 1: BUILD & LINT
  # ======================================================================
  build:
    name: Stage 1 - Build & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend]  # , frontend  # removed frontend for now
    steps:
      - uses: actions/checkout@v4

      # ---- Backend Build ----
      - name: Set up Python
        if: matrix.component == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        if: matrix.component == 'backend'
        run: make install-backend
      - name: Lint backend
        if: matrix.component == 'backend'
        run: make lint-backend

      # ---- Frontend Build (DISABLED) ----
      # Uncomment this block when ready
      # - name: Set up Node.js
      #   if: matrix.component == 'frontend' && env.ENABLE_FRONTEND == 'true'
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #     cache: 'npm'
      #     cache-dependency-path: frontend/package-lock.json
      # - name: Install frontend dependencies
      #   if: matrix.component == 'frontend' && env.ENABLE_FRONTEND == 'true'
      #   run: |
      #     cd frontend
      #     npm ci
      # - name: Build frontend (production)
      #   if: matrix.component == 'frontend' && env.ENABLE_FRONTEND == 'true'
      #   run: |
      #     cd frontend
      #     npm run build

  # ======================================================================
  # STAGE 2: UNIT TESTS
  # ======================================================================
  unit-tests:
    name: Stage 2 - Unit Tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        component: [backend]  # , frontend
    steps:
      - uses: actions/checkout@v4

      # ---- Backend Tests ----
      - name: Set up Python
        if: matrix.component == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        if: matrix.component == 'backend'
        run: make install-backend
      - name: Run pytest
        if: matrix.component == 'backend'
        run: make test-backend

      # ---- Frontend Tests (DISABLED) ----
      # Uncomment this block when ready
      # - name: Set up Node.js
      #   if: matrix.component == 'frontend' && env.ENABLE_FRONTEND == 'true'
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #     cache: 'npm'
      #     cache-dependency-path: frontend/package-lock.json
      # - name: Install frontend deps
      #   if: matrix.component == 'frontend' && env.ENABLE_FRONTEND == 'true'
      #   run: |
      #     cd frontend
      #     npm ci
      # - name: Run Jest tests
      #   if: matrix.component == 'frontend' && env.ENABLE_FRONTEND == 'true'
      #   run: |
      #     cd frontend
      #     npm test -- --coverage

  # ======================================================================
  # STAGE 3: PACKAGING (Docker builds)
  # ======================================================================
  packaging:
    name: Stage 3 - Build Docker Images
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker/GHCR image names must be all-lowercase, but github.repository
      # (used above to build IMAGE_NAME_BACKEND/WORKER) preserves the repo's
      # actual case (e.g. "Sipho-chi1/Gypsi-Trading-Agent-backend"), which
      # buildx rejects. Overwrite the env vars with lowercased versions for
      # the rest of this job only.
      - name: Lowercase image names
        run: |
          echo "IMAGE_NAME_BACKEND=$(echo '${{ env.IMAGE_NAME_BACKEND }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "IMAGE_NAME_WORKER=$(echo '${{ env.IMAGE_NAME_WORKER }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # NOTE: these two steps stay as docker/build-push-action (not `make build`)
      # on purpose — the Makefile's build-backend/build-worker targets build
      # locally with plain `docker build` and don't push, tag with the commit
      # SHA, or use GHA's layer cache. That's the right split: `make build` is
      # for a quick local sanity check, this is the real CI artifact build.
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Frontend Image Build (DISABLED) ----
      # Uncomment this block when ready
      # - name: Build and push Frontend image
      #   if: env.ENABLE_FRONTEND == 'true'
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: ./frontend
      #     file: ./frontend/Dockerfile
      #     push: true
      #     tags: |
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

  # ======================================================================
  # STAGE 4: ACCEPTANCE TESTING
  # ======================================================================
  acceptance:
    name: Stage 4 - Acceptance Tests
    runs-on: ubuntu-latest
    needs: packaging
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: wes_codies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Pull built images from GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:${{ github.sha }}
          # docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}  # commented out

      - name: Start the full stack with docker-compose
        run: |
          export BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          export WORKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:${{ github.sha }}
          export FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          docker-compose -f docker-compose.ci.yml up -d --no-build

      - name: Wait for services to be healthy
        run: |
          sleep 10
          curl --fail --retry 10 --retry-delay 5 http://localhost:8000/health
          # Check worker health if you expose one

      - name: Run acceptance test suite
        run: |
          cd tests/acceptance
          pip install -r requirements.txt
          pytest test_e2e.py -v

      - name: Print logs on failure
        if: failure()
        run: docker-compose -f docker-compose.ci.yml logs

  # ======================================================================
  # STAGE 5: RELEASE (Deploy to Railway/Vercel)
  # ======================================================================
  release:
    name: Stage 5 - Deploy to Production
    runs-on: ubuntu-latest
    needs: acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Deploy backend to Railway
      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh

      - name: Deploy Backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service backend

      - name: Deploy Worker to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service worker

      # ---- Frontend Deploy (DISABLED) ----
      # Uncomment this block when ready
      # - name: Deploy Frontend to Vercel
      #   if: env.ENABLE_FRONTEND == 'true'
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     working-directory: ./frontend
      #     vercel-args: '--prod'
