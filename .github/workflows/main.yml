name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual trigger for debugging
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_WORKER: ${{ github.repository }}-worker
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend

jobs:
  # ------------------------------------------------------------------
  # 1. COMPILE / BUILD
  # ------------------------------------------------------------------
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]   # worker may share backend code
    steps:
      - uses: actions/checkout@v4

      # ---- Backend ----
      - name: Set up Python
        if: matrix.component == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        if: matrix.component == 'backend'
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint  # or ruff for linting

      - name: Lint backend
        if: matrix.component == 'backend'
        run: |
          cd backend
          pylint --fail-under=8.0 **/*.py  # adjust threshold

      # ---- Frontend ----
      - name: Set up Node.js
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm ci
      - name: Build frontend (production)
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000  # placeholder

  # ------------------------------------------------------------------
  # 2. UNIT TESTS
  # ------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build   # wait for build to pass
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # ---- Backend ----
      - name: Set up Python
        if: matrix.component == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        if: matrix.component == 'backend'
        run: |
          cd backend
          pip install -r requirements-dev.txt  # includes pytest, etc.
      - name: Run pytest
        if: matrix.component == 'backend'
        run: |
          cd backend
          pytest tests/unit --cov=. --cov-report=xml

      # ---- Frontend ----
      - name: Set up Node.js
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm ci
      - name: Run Jest tests
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm test -- --coverage

  # ------------------------------------------------------------------
  # 3. PACKAGING (Build Docker images)
  # ------------------------------------------------------------------
  packaging:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker  # or same as backend with different entrypoint
          file: ./worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 4. ACCEPTANCE TESTING (full end‑to‑end with ephemeral env)
  # ------------------------------------------------------------------
  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: packaging
    # Only run on main after packaging (or can be run on PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: wes_codies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Pull built images from GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}

      - name: Start the full stack with docker-compose
        run: |
          export BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          export WORKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:${{ github.sha }}
          export FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          docker-compose -f docker-compose.ci.yml up -d --no-build

      - name: Wait for services to be healthy
        run: |
          sleep 10
          # Simple curl to backend health endpoint
          curl --fail --retry 10 --retry-delay 5 http://localhost:8000/health

      - name: Run acceptance test suite
        run: |
          # For example, run a Python script that simulates a full trade cycle
          cd tests/acceptance
          pip install -r requirements.txt
          pytest test_e2e.py

      - name: Print logs on failure
        if: failure()
        run: docker-compose -f docker-compose.ci.yml logs

  # ------------------------------------------------------------------
  # 5. RELEASE (Deploy to Railway / Vercel)
  # ------------------------------------------------------------------
  release:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Deploy backend & worker to Railway
      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service backend   # adjust service names as needed
          railway up --service worker
        # Note: use railway environment variables for secrets

      # Deploy frontend to Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
